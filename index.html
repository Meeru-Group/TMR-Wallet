<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMR Wallet</title><link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">T</div><div><b>TMR Wallet</b><small>Secure • Non-custodial</small></div></div><button id="settings">⚙</button></header>

<section class="network"><span id="dot">●</span> TMR Blockchain <span id="networkText">Connecting…</span></section>

<section class="balance">
<small>Total TMR Balance</small><h1 id="balance">0.0000 TMR</h1>
<div id="address" class="address">No wallet</div>
<button id="copy">Copy Address</button>
</section>

<div class="actions"><button id="send">↑<span>Send</span></button><button id="receive">↓<span>Receive</span></button><button id="create">＋<span>Wallet</span></button></div>

<section class="card"><div class="title"><h2>Activity</h2><button id="refresh">Refresh</button></div><div id="activity" class="muted">Create or restore a wallet.</div></section>

<section id="walletCard" class="card hidden"><h2>Wallet</h2><p><b>Address</b></p><div id="fullAddress" class="mono box"></div><p><b>Public Key</b></p><div id="publicKey" class="mono box"></div><div class="warning">Never share your private key or backup file.</div><button id="backup">Backup Wallet</button><button id="delete" class="danger">Delete Local Wallet</button></section>

<section class="card"><h2>Restore</h2><input type="file" id="restoreFile" accept=".json,.tmrwallet"><p id="msg" class="muted"></p></section>
</div>
<script type="module" src="src/wallet.js"></script>
</body></html>
